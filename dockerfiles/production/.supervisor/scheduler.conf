[program:scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/liftr-main/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/liftr-main/storage/logs/scheduler.log
stopwaitsecs=60

